<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sai's LeetCode Importer</title>
<style>
body{width:320px;margin:0;padding:18px;background:#0d1117;color:#f2f4f7;font-family:Arial,sans-serif}
h2{margin:0 0 8px;font-size:18px}.muted{color:#9aa4b2;font-size:12px;line-height:1.5}
button{width:100%;padding:11px;border:0;border-radius:8px;background:#ffa116;color:#17110a;font-weight:700;cursor:pointer;margin-top:12px}
button:disabled{opacity:.6;cursor:wait}
#status{margin-top:12px;font-size:12px;line-height:1.5;white-space:pre-wrap}
.ok{color:#4ade80}.err{color:#fb7185}
</style>
</head>
<body>
<h2>🚀 Sai's LeetCode Importer</h2>
<div class="muted">Open a LeetCode page while logged in as <b>kiran_sai45</b>.</div>
<button id="import">Import all accepted submissions</button>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
